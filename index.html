<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f7f5ef'><link rel='manifest' href='manifest.webmanifest'><title>AAC 溝通板</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f7f5ef;color:#222}button,input,select{font:inherit}.app{min-height:100vh;display:flex}.side{width:300px;background:white;border-right:1px solid #ddd;padding:16px;transition:.25s;overflow:auto}.side.closed{width:0;padding:0;border:0;overflow:hidden}.main{flex:1;padding:16px;position:relative}.top{display:flex;gap:10px;align-items:center;margin-bottom:14px}.toggle{font-size:22px;border:0;background:white;border-radius:12px;padding:10px 14px;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:900px;margin:auto}.card{background:white;border:2px solid #e8e4da;border-radius:20px;min-height:180px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px #0001}.card img{width:100%;height:120px;object-fit:contain;border-radius:12px}.emoji{font-size:70px}.label{font-size:24px;font-weight:700;margin-top:8px}.pages{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;max-width:min(72vw,520px);overflow-x:auto;background:#ffffffdd;backdrop-filter:blur(8px);padding:9px;border-radius:16px;box-shadow:0 3px 18px #0002}.thumb{min-width:95px;border:2px solid transparent;border-radius:12px;padding:7px;background:#f2efe8}.thumb.active{border-color:#555}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;font-size:13px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.editList{display:grid;gap:10px}.editor{border:1px solid #ddd;border-radius:12px;padding:10px}.editor input[type=text]{width:100%;padding:8px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.rec{background:#d94b4b;color:white;border:0;border-radius:9px;padding:8px}.small{border:1px solid #ccc;background:#fafafa;border-radius:9px;padding:8px}.status{font-size:12px;color:#666}.hint{font-size:13px;color:#666;line-height:1.5}@media(max-width:700px){.side{position:fixed;z-index:5;height:100vh;width:86vw;max-width:330px;box-shadow:5px 0 20px #0002}.grid{gap:8px}.card{min-height:145px}.card img{height:88px}.emoji{font-size:54px}.label{font-size:20px}.main{padding:10px}.pages{right:10px;bottom:10px}.thumb{min-width:82px}}

.side{width:390px;padding:18px 22px}.side h2{margin:6px 0 16px;font-size:23px}.side h3{margin:18px 0 8px}.field{margin:10px 0}.field select,.compactEditor input[type=text]{width:100%;padding:12px 14px;border:1px solid #aac4d6;border-radius:12px;background:#fff}.slotPicker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}.slotBtn{padding:10px 5px;border:1px solid #b8d0df;background:#f5f9fc;border-radius:11px}.slotBtn.active{border:2px solid #0099a8;background:#e8f7f8}.compactEditor label.sectionLabel{display:block;font-weight:700;margin:12px 0 7px}.fileBox{border:1px solid #aac4d6;border-radius:12px;padding:9px;background:#fff}.fileBox input{max-width:100%}.compactActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.compactActions button{padding:10px 8px;border:0;border-radius:11px;background:#e9f1f6}.compactActions .rec{background:#155889;color:#fff}.voiceBox{border-top:1px solid #dbe3e8;margin-top:18px;padding-top:2px}.hint{margin-bottom:20px}@media(max-width:700px){.side{width:88vw;max-width:390px;padding:14px 18px}.side h2{font-size:21px}}
</style></head><body><div class='app'><aside id='side' class='side closed'><h2>編輯九宮格</h2><div class='field'><label>選擇頁面</label><select id='editPage'><option value='0'>第 1 頁</option><option value='1'>第 2 頁</option><option value='2'>第 3 頁</option></select></div><div id='slotPicker' class='slotPicker'></div><div id='editList'></div><div class='voiceBox'><h3>🔊 語音設定</h3><div class='field'><label>聲音選單</label><select id='voice'></select></div><div class='row'><button id='testVoice' class='small'>▶ 試聽「你好棒！」</button></div><div class='field'><label>語速</label><select id='rate'><option>.7</option><option>.8</option><option>.9</option><option selected>1.0</option></select></div><p class='hint'>圖片、文字、錄音與語音設定會保存在這台裝置。錄音需允許麥克風權限；iPhone 可由相簿選取照片。</p></div></aside><main class='main'><div class='top'><button id='toggle' class='toggle'>☰ 老師設定</button><h1 style='margin:0;font-size:24px'>AAC 溝通板</h1></div><div id='grid' class='grid'></div><div id='pages' class='pages'></div></main></div><script>
const defaults=[['書包','餐袋','水壺','鞋子','襪子','牛奶','香蕉','膠水','毛巾'],['我要','不要','幫忙','休息','廁所','喝水','吃東西','再一次','完成'],['你好','謝謝','對不起','開心','難過','喜歡','不喜歡','回家','老師']];
const emojis=['🎒','🍱','💧','👟','🧦','🥛','🍌','🧴','🧻','🙋','🙅','🆘','🛋️','🚻','🥤','🍽️','🔁','✅','👋','🙏','🙇','😊','😢','❤️','💔','🏠','👩‍🏫'];
let db; let page=0; let recordings={}; let state=JSON.parse(localStorage.getItem('aacState')||'null')||{pages:defaults.map((p,pi)=>p.map((t,i)=>({text:t,img:null,emoji:emojis[pi*9+i]}))),rate:'1.0',voice:''};
function save(){localStorage.setItem('aacState',JSON.stringify(state))} function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('aacAudio',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio');r.onsuccess=()=>{db=r.result;res()};r.onerror=rej})} function putAudio(k,b){let tx=db.transaction('audio','readwrite');tx.objectStore('audio').put(b,k)} function getAudio(k){return new Promise(res=>{let r=db.transaction('audio').objectStore('audio').get(k);r.onsuccess=()=>res(r.result)})}
function render(){const g=document.querySelector('#grid');g.innerHTML='';state.pages[page].forEach((x,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML=x.img?`<img src="${x.img}"><div class=label>${x.text}</div>`:`<div class=emoji>${x.emoji||'🗣️'}</div><div class=label>${x.text}</div>`;b.onclick=()=>play(page,i,x.text);g.appendChild(b)});renderPages()}
async function play(p,i,text){let blob=await getAudio(`${p}-${i}`);if(blob){new Audio(URL.createObjectURL(blob)).play()}else{speak(text)}} function speak(text){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=+state.rate;let vs=speechSynthesis.getVoices(),v=vs.find(v=>v.name===state.voice);if(v)u.voice=v;speechSynthesis.speak(u)}
function renderPages(){let e=document.querySelector('#pages');e.innerHTML='';state.pages.forEach((p,pi)=>{let b=document.createElement('button');b.className='thumb '+(pi===page?'active':'');b.innerHTML=`<b>第 ${pi+1} 頁</b><div class=mini>${p.map(x=>`<span>${x.emoji||'●'}</span>`).join('')}</div>`;b.onclick=()=>{page=pi;render()};e.appendChild(b)})}
let editSlot=0;
function renderEditors(){
 let ep=+document.querySelector('#editPage').value, picker=document.querySelector('#slotPicker'), e=document.querySelector('#editList');
 picker.innerHTML='';
 state.pages[ep].forEach((x,i)=>{let b=document.createElement('button');b.className='slotBtn '+(i===editSlot?'active':'');b.textContent=`${i+1} ${x.text}`;b.onclick=()=>{editSlot=i;renderEditors()};picker.appendChild(b)});
 let x=state.pages[ep][editSlot], i=editSlot;
 e.innerHTML=`<div class="compactEditor"><label class="sectionLabel">圖片名稱</label><input type="text" value="${x.text.replaceAll('"','&quot;')}" data-text><label class="sectionLabel">從 iPhone 相簿選擇圖片</label><div class="fileBox"><input data-img type="file" accept="image/*"></div><div class="row"><button class="small" data-remove-img>移除圖片</button></div><label class="sectionLabel">這一格的錄音</label><div class="compactActions"><button class="rec" data-rec>● 開始錄音</button><button class="small" data-stop disabled>■ 停止錄音</button><button class="small" data-play>▶ 播放錄音</button><button class="small" data-del>移除錄音</button></div><div class="status" data-status></div></div>`;
 e.querySelector('[data-text]').oninput=a=>{x.text=a.target.value;save();render();let btn=picker.children[i];if(btn)btn.textContent=`${i+1} ${x.text}`};
 e.querySelector('[data-img]').onchange=a=>{let f=a.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{x.img=r.result;save();render()};r.readAsDataURL(f)};
 e.querySelector('[data-remove-img]').onclick=()=>{x.img=null;save();render();};
 let recBtn=e.querySelector('[data-rec]'),stopBtn=e.querySelector('[data-stop]'),status=e.querySelector('[data-status]'),mr=null,stream=null;
 recBtn.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];mr=new MediaRecorder(stream);mr.ondataavailable=q=>chunks.push(q.data);mr.onstop=()=>{putAudio(`${ep}-${i}`,new Blob(chunks,{type:mr.mimeType}));stream.getTracks().forEach(t=>t.stop());status.textContent='已儲存錄音';recBtn.disabled=false;stopBtn.disabled=true};mr.start();status.textContent='錄音中…';recBtn.disabled=true;stopBtn.disabled=false}catch{status.textContent='無法使用麥克風，請檢查權限'}};
 stopBtn.onclick=()=>{if(mr&&mr.state==='recording')mr.stop()};
 e.querySelector('[data-play]').onclick=()=>play(ep,i,x.text);
 e.querySelector('[data-del]').onclick=()=>{db.transaction('audio','readwrite').objectStore('audio').delete(`${ep}-${i}`);status.textContent='錄音已刪除'};
}
function voices(){let sel=document.querySelector('#voice'),vs=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('zh'));sel.innerHTML='<option value="">系統預設</option>'+vs.map(v=>`<option ${v.name===state.voice?'selected':''}>${v.name}</option>`).join('')} speechSynthesis.onvoiceschanged=voices;
document.querySelector('#toggle').onclick=()=>document.querySelector('#side').classList.toggle('closed');document.querySelector('#editPage').onchange=()=>{editSlot=0;renderEditors()};document.querySelector('#rate').value=state.rate;document.querySelector('#rate').onchange=e=>{state.rate=e.target.value;save()};document.querySelector('#voice').onchange=e=>{state.voice=e.target.value;save()};document.querySelector('#testVoice').onclick=()=>speak('你好棒！');
openDB().then(()=>{render();renderEditors();voices()});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
